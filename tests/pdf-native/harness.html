<!doctype html><script type="module">
import {createDocumentModel} from '/src/lib/document-model/index.ts';
import {generateNativePdf} from '/src/lib/pdf/generate-pdf.ts';
window.generatePdf = async (source, options = {}) => {
 const model = createDocumentModel(source);
 if (options.landscape) { model.settings.pageSize='letter'; model.settings.orientation='landscape'; }
 if (options.unsafe) model.blocks.push({type:'paragraph',children:[{type:'link',url:'javascript:alert(1)',title:null,children:[{type:'text',value:'unsafe'}],destination:'external',targetId:null}]});
 const result=await generateNativePdf(model);
 return { bytes:Array.from(new Uint8Array(await result.blob.arrayBuffer())), diagnostics:result.diagnostics };
};
</script>
